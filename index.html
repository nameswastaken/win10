<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>window</title>
    <style>
        @font-face {
            font-family: 'Segoe UI';
            src: url('./fonts/Segoe UI.ttf');
        }
        @font-face {
            font-family: 'Segoe Icon';
            src: url('./fonts/iconsetSGUI.ttf');
        }
        @font-face {
            font-family: 'Segoe UI Light';
            src: url('./fonts/Segoe UI Light.ttf');
        }
        body {
            background-image: url('./bgs/1440-16-9.jpg');
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-size: cover;
            margin: 0;
            font-family: 'Segoe UI';
            overflow: hidden;
        }
        .taskbar {
            display: flex;
            height: 40px;
            width: 100%;
            background-color: rgb(0, 0, 0);
            bottom: 0;
            position: fixed;
            color: white;
            z-index: 23489423982;
        }
        #startbutton {
            background-color: inherit;
            border: none;
            transition: 0.15s linear;
        }
        #startbutton:hover {
            background-color: rgb(18, 18, 18);
            transition: 0.15s linear;
        }
        #startbutton img:hover {
            filter: invert(37%) sepia(88%) saturate(3071%) hue-rotate(188deg) brightness(87%) contrast(101%);
            transition: 0.15s;
        }
        #startbutton img {  
            width: 17px;
            height: 17px;
            padding-left: 9px;
            padding-right: 9px;
            transition: 0.15s;
        }
        #searchbar {
            width: 309px;
            background-color: rgb(34, 34, 34);
            border: none;
            padding-left: 10px;
            font-size: 15px;
            color: white;
            outline: none;
        }
        #statusicons img {
            width: 16px;
            height: 16px;
        }
        #statusicons {
            height: inherit;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-left: auto;
        }
        #datetime {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 12.5px;
        }
        #showdesktop {
            height: 100%;
            border-radius: 0;
            outline: none;
            background-color: black;
            border: none;
            width: 1px;
            border-left: solid 1.5px #313131;
            margin-left: 10px;
        }
        .taskbarapp img {
            width: 20px;
            height: auto;
        }
        .taskbarapp {
            height: 40px;
            width: 47px;
            border: none;
            outline: none;
            background-color: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.15s;
        }
        .taskbarapp:hover {
            background-color: rgb(18, 18, 18);
            transition: 0.15s;
        }
        #defaultbutton {
            transition: 0.15s;
            background-color: inherit;
            border: none;
            outline: none;
            width: auto;
            height: 40px;
            color: white;
            font-family: 'Segoe UI';
        }
        #defaultbutton:hover {
            transition: 0.15s;
            background-color: rgb(18, 18, 18);
        }
        .win-btn {
            font-family: 'Segoe Icon';
        }
    </style>
</head>
<body>
    <div id="taskbar" class="taskbar">
        <button id="startbutton"><img src="icon.svg"></button>
        <input id="searchbar" type="text" placeholder="Search the web and Windows"></input>
        <div id="statusicons">
            <button id="defaultbutton"><img src="icns/ethernet.ico"></button>
            <button id="defaultbutton"><img src="icns/volume-mute.ico"></button>
            <button id="defaultbutton"><div id="datetime">
                <span id="timetaskbar">12:00 AM</span>
                <span id="datetaskbar">1/1/2015</span>
            </div>
            </button>
            <button id="showdesktop"></button>
        </div>
    </div>
</body>
    <script src="./js/clock.js"></script>
    <script src="./js/taskbar.js"></script>
    <script src="./js/applist.js"></script>
    <script src="./js/prgman.js"></script>
    <script src="./js/windowdrag.js"></script>
    <script src="./js/csmHTML.js"></script>
</html>
