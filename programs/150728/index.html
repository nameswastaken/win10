<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edge</title>
    <style>
        @font-face {
            font-family: 'Segoe UI';
            src: url('../../fonts/Segoe UI.ttf');
        }
        @font-face {
            font-family: 'Segoe Icon';
            src: url('../../fonts/iconsetSGUI.ttf');
        }
        @font-face {
            font-family: 'Segoe UI Light';
            src: url('../../fonts/Segoe UI Light.ttf');
        }
        html, body{
        background-color: #cccccd;
        border: 0;
        margin: 0;
        height: 100%;
        width: 100%;
        display: flex;
        flex-direction: column;
        font-family: 'Segoe UI';
        }
        .navbar-Edge {
            height: 50px;
            width: 100%;
            background-color: #f2f2f2;
            color: black;
            font-family: 'Segoe UI';
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        iframe {
            width: 100%;
            flex-grow: 1;
        }
        .searchbar {
            height: 70%;
            width: 50%;
            background-color: #ffffff;
            border: 1px solid #cccccd;
            border-top: 1px solid #cccccd;
            border-bottom: 1px solid #cccccd;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe Icon';
        }
        .searchbar button {
            background-color: inherit;
            border: none;
            font-family: 'Segoe Icon';
            font-size: 14px;
            padding-left: 10px;
            padding-right: 10px;
            height: 100%;
        }
        .searchbar hr {
            height: 75%;
            border: none;
            border-left: solid 1px #cccccd;
        }
    </style>
</head>
<body>
    <div class="navbar-Edge">
        <div class="searchbar">
            <button><span>&#xE72E;</span></button>
            <hr>
            <input type="text" id="urlsearch" placeholder="Search or enter web address" style="width: 100%; height: 90%; border: none; outline: none; font-family: 'Segoe UI'; font-size: 14px; padding-left: 10px;">
        </div>
    </div>
    <iframe id="webpage" src="https://wikipedia.com"></iframe>
</body>
<script src="searchbar.js"></script>
</html>
