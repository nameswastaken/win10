<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edge</title>
    <style>
        @font-face {
            font-family: 'Segoe UI';
            src: url('../../fonts/Segoe UI.ttf');
        }
        @font-face {
            font-family: 'Segoe Icon';
            src: url('../../fonts/iconsetSGUI.ttf');
        }
        @font-face {
            font-family: 'Segoe UI Light';
            src: url('../../fonts/Segoe UI Light.ttf');
        }
        html, body{
        background-color: #cccccc;
        border: 0;
        margin: 0;
        height: 100%;
        width: 100%;
        display: flex;
        flex-direction: column;
        font-family: 'Segoe UI';
        overflow: hidden;
        }
        .navbar-Edge {
            height: 50px;
            width: 100%;
            background-color: #f2f2f2;
            color: black;
            font-family: 'Segoe UI';
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 21;
        }
        .navbar-Edge button {
            transition: 0.15s;
        }
        .navbar-Edge button:hover {
            background-color:#e3e3e3;
            transition: 0.15s;
        }
        iframe {
            width: 100%;
            flex-grow: 1;
        }
        .searchbar {
            height: 70%;
            width: 100%;
            background-color: #ffffff;
            border: 1px solid #cccccd;
            border-top: 1px solid #cccccd;
            border-bottom: 1px solid #cccccd;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe Icon';
        }
        .searchbar button {
            background-color: inherit;
            border: none;
            font-family: 'Segoe Icon';
            font-size: 14px;
            padding-left: 10px;
            padding-right: 10px;
            height: 100%;
        }
        .searchbar hr {
            height: 75%;
            border: none;
            border-left: solid 1px #cccccd;
        }
        .navbar-Edge span {
            font-family: 'Segoe Icon';
        }
        .leftbuttons {
            margin-right: 20px;
        }
        .rightbuttons {
            margin-left: 20px;
        }
        .leftbuttons, .rightbuttons {
            display: flex;
            height: 100%;
        }
        .leftbuttons button, .rightbuttons button {
            height: 100%;
            width: 50px;
            background-color: inherit;
            border: none;
            outline: none;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .icon {
            font-family: 'Segoe Icon';
        }
        .tabbar-Edge {
            height: 35px;
            display: flex;
        }
        .tabbar-Edge .tab {
            display: flex;
            align-items: center;
            background-color: #f2f2f2;
            border: 1px solid #cccccd;
            flex-grow: 1;
            max-width: 180px;
            font-family: 'Segoe UI';
        }
        .tabbar-Edge .tab .tabimg-Edge {
            width: 20px;
            height: 20px;
            margin-right: 5px;
            font-family: 'Segoe Icon';
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
        }
        .tabbar-Edge .tab .close {
            margin-left: auto;
        }
        .tabbar-Edge .taboption {
            height: 100%;
            width: 35px;
            background-color: inherit;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
    <div id="tabbarEdge" class="tabbar-Edge">
        <!--this is temporary unti i add tabbing because if its fixed it cannot be like dynamically added-->
        <button class="taboption"><span class="icon">&#xF5ED;</span></button>
        <button class="taboption" id="addtabEdge" onclick="createtab();"><span class="icon">&#xE710;</span></button>
    </div>
    <div class="navbar-Edge">
        <div class="leftbuttons">
            <button><span>&#xE72B;</span></button>
            <button><span>&#xE72A;</span></button>
            <button onclick="refresh()"><span>&#xE72C;</span></button>
        </div>
        <div class="searchbar">
            <button><span>&#xE72E;</span></button>
            <hr>
            <input type="text" id="urlsearch" placeholder="Search or enter web address" style="width: 100%; height: 90%; border: none; outline: none; font-family: 'Segoe UI'; font-size: 14px; padding-left: 10px;" autocomplete="off">
        </div>
        <div class="rightbuttons">
            <button><span>&#xE728;</span></button>
            <button><span>&#xEE56;</span></button>
            <button><span>&#xE72D;</span></button>
            <button><span>&#xE712;</span></button>
        </div>
    </div>
</body>
<script src="tab.js"></script>
<script src="searchbar.js"></script>
</html>
